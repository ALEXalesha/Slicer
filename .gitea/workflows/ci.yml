# Проверки на домашней Gitea, на раннере ПК (метка windows). Законы ядра идут и с настоящим
# движком, если на раннере стоит ElegooSlicer. Окно Electron (npm run test:app) - только локально.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Tests
    runs-on: windows
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Node dependencies
        run: npm ci --no-audit --no-fund
      - name: Core laws (node:test + fast-check)
        run: npm test
