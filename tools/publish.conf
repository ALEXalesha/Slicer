# Настройки выкладки на GitHub для tools/publish_github.sh (общий скрипт
# AiGames/PythonAiGames/tools/publish_game.sh, там же описаны все поля). Читается через source.
REPO=ALEXalesha/Slicer

# Сервис донатов отменён 18.10: вырезать из всей публикуемой истории его значок, строку
# «☕» и упоминания в сообщениях. Слово записано через [K]: иначе TEXT_FORBID ловил бы сами правила.
TEXT_GREP='[k]o-?fi'
TEXT_SED=(
  '\#^\[!\[[^]]*[K]o-fi[^]]*\]\([^)]*\)\]\(https://[k]o-fi\.com/[^)]*\)$#d'
  's# ?\[!\[[^]]*[K]o-fi[^]]*\]\([^)]*\)\]\(https://[k]o-fi\.com/[^)]*\)##g'
  '/^$/{N;/\n☕.*[k]o-fi\.com/d;P;D;}'
  '/^☕.*[k]o-fi\.com/d'
  's#, [K]o-fi\)#)#g'
  's# и строка «☕ [.][.][.] [K]o-fi: https://[k]o-fi\.com/[a-z]+»##g'
  's#, бейджами и [K]o-fi#, бейджами#g'
  's#, [K]o-fi отдельной строкой текста##g'
  's#значок и строка [K]o-fi убраны \(Алексей отменил [K]o-fi 18\.10 19:31\)#лишние значок и строка убраны#g'
)
TEXT_FORBID='[k]o-?_?fi'
# Пустые после чистки коммиты выбрасываются только при непустом DROP_PATHS (--prune-empty).
# В .github это сам FUNDING.yml, в остальных репо такого файла нет.
DROP_PATHS=(FUNDING.yml)
